name: CI - Aplicacao e Imagens Docker

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  id-token: write

jobs:
  backend-testes-e-build:
    name: Backend - Testes e Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Injetar segredos do Infisical (OIDC)
        if: github.event_name == 'push'
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      - name: Validar segredos injetados
        if: github.event_name == 'push'
        run: test -n "$DATABASE_URL" && test -n "$JWT_ACCESS_SECRET" && test -n "$JWT_REFRESH_SECRET"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar TypeScript
        run: npm run build

  frontend-build:
    name: Frontend - Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Build Next.js
        run: npm run build

  docker-build:
    name: Docker - Build das Imagens
    runs-on: ubuntu-latest
    needs: [backend-testes-e-build, frontend-build]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build imagem Backend
        run: docker build -t cloudops-backend:ci ./backend

      - name: Build imagem Frontend
        run: docker build -t cloudops-frontend:ci ./frontend
