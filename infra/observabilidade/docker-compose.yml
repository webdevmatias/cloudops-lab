services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cloudops-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=128MB
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dados:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 192m
    networks:
      - observabilidade

  grafana:
    image: grafana/grafana:11.4.0
    container_name: cloudops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD nao definida}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    volumes:
      - grafana_dados:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - prometheus
      - loki
    mem_limit: 256m
    networks:
      - observabilidade

  loki:
    image: grafana/loki:3.2.1
    container_name: cloudops-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_dados:/loki
    mem_limit: 192m
    networks:
      - observabilidade

  promtail:
    image: grafana/promtail:3.2.1
    container_name: cloudops-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_posicoes:/var/lib/promtail
    depends_on:
      - loki
    mem_limit: 64m
    networks:
      - observabilidade

volumes:
  prometheus_dados:
  grafana_dados:
  loki_dados:
  promtail_posicoes:

networks:
  observabilidade:
    driver: bridge
